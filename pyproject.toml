[project]
name = "fly-in-new"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
]

[tool.mypy]
mypy_path = "src"
exclude = ["^\\.venv/"]
